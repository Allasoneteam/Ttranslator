# Tests and builds on every change. Builds go to the run's artifacts; releases are made separately, only after the
# author's "yes".
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages (own window, virtual screen, Windows cross-build)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool imagemagick g++-mingw-w64-x86-64
      - name: Python packages
        run: |
          pip install playwright numpy gguf pefile pillow
          python -m playwright install --with-deps chromium
      - name: All test suites
        run: bash source/tests/run_all.sh "$RUNNER_TEMP/tdoc-tests"
      - name: Screenshots of the tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: ${{ runner.temp }}/tdoc-tests/shots
          retention-days: 7

  build:
    # Ubuntu 22.04: the Linux window program then runs on Ubuntu 22.04, Debian 12 and newer (glibc 2.35+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev g++-mingw-w64-x86-64
      - name: Build
        run: sh source/build.sh
      - name: Checksums
        run: sha256sum Ttranslator.exe ttranslator-linux ttranslator-window.exe ttranslator-window-linux | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ttranslator-programs
          path: |
            Ttranslator.exe
            ttranslator-linux
            ttranslator-window.exe
            ttranslator-window-linux
            SHA256SUMS.txt
          retention-days: 14
