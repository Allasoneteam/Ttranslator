# Tests and builds on every push to any branch (main, dev and the branches of Claude's cloud sessions, claude/...).
# Builds and the ready-to-run archives for Windows and Linux (the engine inside; source/release.sh) and the Mac go to
# the run's artifacts — test builds. Releases only after the author's "yes": main gets only releases, and a push to
# main makes a DRAFT release (the release job) that the author publishes in the browser. On a failure the last lines
# of the output are also shown as annotations of the run.
# The macos and android jobs only run scripts of the repository (source/ci/macos.sh, android/ci.sh): the work on
# macOS (1.1) and Android (1.2) change those scripts, not this file. Until a script exists its job only says so and
# passes. The APK for phones is signed by android-sign with the app's own key — a secret of the GitHub environment
# android-signing, which only main and dev may use (Settings → Environments).
name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# a newer push to the same branch cancels the run still going on it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: System packages (app window, virtual screen with a window manager, Windows cross-build)
        timeout-minutes: 25
        run: |
          # apt on the runner sometimes hangs (a mirror, or the package lock held by automatic updates): time limits,
          # three attempts, and an annotation that says which command failed
          pkgs="g++ pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool imagemagick openbox x11-utils g++-mingw-w64-x86-64 desktop-file-utils"
          for attempt in 1 2 3; do
            if ! sudo timeout 300 apt-get -o Acquire::Retries=3 update; then
              echo "::warning::apt-get update failed or took too long (attempt $attempt)"; sleep 20; continue
            fi
            if sudo timeout 900 apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 install -y $pkgs; then exit 0; fi
            echo "::warning::apt-get install failed or took too long (attempt $attempt)"; sleep 20
          done
          echo "::error::the system packages could not be installed"; exit 1
      - name: Python packages
        run: |
          pip install playwright numpy gguf pefile pillow
          python -m playwright install --with-deps chromium
      - name: All test suites
        run: |
          set -o pipefail
          bash source/tests/run_all.sh "$RUNNER_TEMP/tdoc-tests" 2>&1 | tee "$RUNNER_TEMP/tests.log" || {
            grep -E '^(  FAIL|FAIL |ERROR:)' "$RUNNER_TEMP/tests.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Screenshots of the tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: ${{ runner.temp }}/tdoc-tests/shots
          retention-days: 7

  build:
    # Ubuntu 22.04: the Linux window program then runs on Ubuntu 22.04, Debian 12 and newer (glibc 2.35+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev g++-mingw-w64-x86-64
      - name: Build
        run: |
          set -o pipefail
          sh source/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -v -E 'pragma|^ *\||^ *[0-9]+ \|' "$RUNNER_TEMP/build.log" | tail -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Checksums
        run: sha256sum Ttranslator.exe ttranslator-linux ttranslator-window.exe ttranslator-window-linux | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ttranslator-programs
          path: |
            Ttranslator.exe
            ttranslator-linux
            ttranslator-window.exe
            ttranslator-window-linux
            SHA256SUMS.txt
          retention-days: 14
      - name: Archives for Windows and Linux (test builds)
        run: |
          set -o pipefail
          sh source/release.sh "$RUNNER_TEMP/dist" 2>&1 | tee "$RUNNER_TEMP/release.log" || {
            tail -20 "$RUNNER_TEMP/release.log" | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cd "$RUNNER_TEMP/dist" && echo "WINZIP=$(ls Ttranslator-*-windows-x64.zip)" >> "$GITHUB_ENV" \
            && echo "LINTGZ=$(ls Ttranslator-*-linux-x64.tar.gz)" >> "$GITHUB_ENV"
      # one artifact per archive, not zipped again: the download is the archive itself
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/dist/${{ env.WINZIP }}
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/dist/${{ env.LINTGZ }}
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: archives-SHA256SUMS
          path: ${{ runner.temp }}/dist/SHA256SUMS.txt
          retention-days: 14

  macos:
    # macOS (1.1): Intel and Apple Silicon. source/ci/macos.sh <arch> <out-dir> builds, checks and puts the results
    # (archives, screenshots, logs) into <out-dir>; to have its archive uploaded as itself (not zipped again) it writes
    # MACZIP=<file name in out-dir> to $GITHUB_ENV.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and check (source/ci/macos.sh)
        run: |
          if [ -f source/ci/macos.sh ]; then
            bash source/ci/macos.sh "${{ matrix.arch }}" "$RUNNER_TEMP/macos-${{ matrix.arch }}"
          else
            echo "no source/ci/macos.sh yet: nothing to build for macOS"
          fi
      - name: Results of the run (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-results
          path: ${{ runner.temp }}/macos-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 14
      - name: The archive itself (not zipped again)
        if: env.MACZIP != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/macos-${{ matrix.arch }}/${{ env.MACZIP }}
          archive: false
          retention-days: 14

  android:
    # Android (1.2): android/ci.sh <out-dir> builds the test APK and the APK for phones (not signed), checks the test APK
    # in the emulator (Linux runners have hardware acceleration for it) and puts the results (the APKs, logs,
    # screenshots) into <out-dir>; the name of the APK for phones goes to $GITHUB_ENV as APKUNSIGNED.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - name: Build and check (android/ci.sh)
        run: |
          if [ -f android/ci.sh ]; then
            bash android/ci.sh "$RUNNER_TEMP/android"
          else
            echo "no android/ci.sh yet: nothing to build for Android"
          fi
      - name: Results of the run (test APK, logs, screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-results
          path: ${{ runner.temp }}/android
          if-no-files-found: ignore
          retention-days: 14
      - name: The APK for phones, not signed (for android-sign)
        if: env.APKUNSIGNED != ''
        uses: actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/android/${{ env.APKUNSIGNED }}
          retention-days: 14

  android-sign:
    # The APK for phones signed with the app's own key (main and dev only: the environment android-signing gives its
    # secrets to no other branch). The certificate must be the one in android/signing-cert-sha256.txt.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-signing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-unsigned
          path: unsigned
      - name: Sign (apksigner) and check the certificate
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] || { echo "::error::no signing key: the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD of the environment android-signing"; exit 1; }
          in=$(ls unsigned/Ttranslator-*-android-arm64-unsigned.apk | head -n 1)
          [ -f "$in" ] || { echo "::error::no unsigned APK"; exit 1; }
          name=$(basename "$in" -unsigned.apk).apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          ks=$RUNNER_TEMP/release.p12
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$ks"
          "$bt/zipalign" -f 4 "$in" "$RUNNER_TEMP/aligned.apk"
          mkdir -p signed
          "$bt/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias ttranslator --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "signed/$name" "$RUNNER_TEMP/aligned.apk"
          rm -f "$ks"
          v=$RUNNER_TEMP/verify.txt
          if ! "$bt/apksigner" verify --verbose --print-certs "signed/$name" > "$v" 2>&1; then
            head -n 30 "$v" | while IFS= read -r l; do echo "::error title=apksigner verify::$l"; done; exit 1
          fi
          cat "$v"
          got=$(grep -i 'certificate SHA-256 digest' "$v" | head -n 1 | sed 's/.*digest:[[:space:]]*//' | tr -d ' :\r' | tr a-f A-F)
          want=$(tr -d ' :\n\r' < android/signing-cert-sha256.txt | tr a-f A-F)
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            grep -v '^WARNING' "$v" | head -n 30 | while IFS= read -r l; do echo "::notice title=apksigner::$l"; done
            echo "::error::the APK is signed with another certificate: '$got' (want $want)"; exit 1
          fi
          (cd signed && sha256sum "$name" | tee "$name.sha256")
          echo "::notice title=APK::$(cat "signed/$name.sha256"), certificate SHA-256 $got"
          echo "APKSIGNED=$name" >> "$GITHUB_ENV"
      # the APK as itself (not zipped again): the release job takes it from here
      - uses: actions/upload-artifact@v7
        with:
          path: signed/${{ env.APKSIGNED }}
          archive: false
          retention-days: 14

  release:
    # The release, after the author's "yes" (main gets only releases). A push to main makes a DRAFT release v<version>
    # (appVersion in source/launcher/main.go) with the four archives and the signed APK of this run, SHA256SUMS.txt and the text of
    # source/docs/RELEASE.md; the tag is made at this commit when the author publishes the draft in the browser
    # (Releases → the draft → Edit → Publish release). A published release is never touched; an older draft of the same
    # version is replaced. A push to dev rehearses it: the draft v<version>-rehearsal is made and deleted at once
    # (checks the archives, the text and the right to make releases).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [tests, build, macos, android-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Version and the text of the release
        run: |
          v=$(sed -n 's/^[[:space:]]*appVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' source/launcher/main.go | head -n 1)
          [ -n "$v" ] || { echo "::error::no appVersion in source/launcher/main.go"; exit 1; }
          grep -q "Ttranslator $v" source/docs/RELEASE.md || { echo "::error::source/docs/RELEASE.md is not the text of $v"; exit 1; }
          sed '/^<!--/,/-->$/d' source/docs/RELEASE.md > "$RUNNER_TEMP/notes.md"   # without the comment at the top
          echo "V=$v" >> "$GITHUB_ENV"
      # the archives were uploaded as themselves (archive: false); skip-decompress: the zip archives must stay zips
      - uses: actions/download-artifact@v8
        with:
          pattern: Ttranslator-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: The archives and SHA256SUMS.txt
        run: |
          mkdir -p out
          files="Ttranslator-$V-windows-x64.zip Ttranslator-$V-linux-x64.tar.gz Ttranslator-$V-macos-arm64.zip Ttranslator-$V-macos-x64.zip Ttranslator-$V-android-arm64.apk"
          for f in $files; do
            p=$(find dist -type f -name "$f" | head -n 1)
            if [ -z "$p" ]; then
              find dist | head -n 40 | while IFS= read -r l; do echo "::notice title=downloaded::$l"; done
              echo "::error::no $f among the artifacts of this run"; exit 1
            fi
            cp "$p" "out/$f"
          done
          cd out
          for f in $files; do
            case $f in
              *.zip|*.apk) unzip -tq "$f" > /dev/null ;;
              *.tar.gz) tar -tzf "$f" > /dev/null ;;
            esac || { echo "::error::$f is not a whole archive"; exit 1; }
          done
          sha256sum $files > SHA256SUMS.txt && cat SHA256SUMS.txt
          while IFS= read -r l; do echo "::notice title=SHA-256::$l"; done < SHA256SUMS.txt
          echo "FILES=$files SHA256SUMS.txt" >> "$GITHUB_ENV"
      - name: The draft release
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then tag=v$V; else tag=v$V-rehearsal; fi
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then echo "::notice::the release $tag is already published: left as it is"; exit 0; fi
          if [ "$state" = true ]; then gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes; fi
          cd out
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Ttranslator $V" \
            --notes-file "$RUNNER_TEMP/notes.md" $FILES
          n=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          [ "$n" = 6 ] || { echo "::error::the draft $tag has $n files, not 6"; exit 1; }
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "::notice::the draft release $tag is ready: Releases → $tag → Edit → Publish release"
          else
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes && echo "::notice::rehearsal: the draft $tag was made with 6 files and deleted"
          fi
