# Tests and builds on every push to any branch (main, dev and the branches of Claude's cloud sessions, claude/...).
# Builds and the ready-to-run archives for Windows and Linux (the engine inside; source/release.sh) go to the run's
# artifacts — test builds; releases are made separately, only after the author's "yes". On a failure the last lines
# of the output are also shown as annotations of the run.
# The macos and android jobs only run scripts of the repository (source/ci/macos.sh, android/ci.sh): the work on
# macOS (1.1) and the Android prototype change those scripts, not this file. Until a script exists its job only
# says so and passes.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# a newer push to the same branch cancels the run still going on it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: System packages (app window, virtual screen with a window manager, Windows cross-build)
        timeout-minutes: 25
        run: |
          # apt on the runner sometimes hangs (a mirror, or the package lock held by automatic updates): time limits,
          # three attempts, and an annotation that says which command failed
          pkgs="g++ pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool imagemagick openbox x11-utils g++-mingw-w64-x86-64 desktop-file-utils"
          for attempt in 1 2 3; do
            if ! sudo timeout 300 apt-get -o Acquire::Retries=3 update; then
              echo "::warning::apt-get update failed or took too long (attempt $attempt)"; sleep 20; continue
            fi
            if sudo timeout 900 apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300 install -y $pkgs; then exit 0; fi
            echo "::warning::apt-get install failed or took too long (attempt $attempt)"; sleep 20
          done
          echo "::error::the system packages could not be installed"; exit 1
      - name: Python packages
        run: |
          pip install playwright numpy gguf pefile pillow
          python -m playwright install --with-deps chromium
      - name: All test suites
        run: |
          set -o pipefail
          bash source/tests/run_all.sh "$RUNNER_TEMP/tdoc-tests" 2>&1 | tee "$RUNNER_TEMP/tests.log" || {
            grep -E '^(  FAIL|FAIL |ERROR:)' "$RUNNER_TEMP/tests.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Screenshots of the tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: ${{ runner.temp }}/tdoc-tests/shots
          retention-days: 7

  build:
    # Ubuntu 22.04: the Linux window program then runs on Ubuntu 22.04, Debian 12 and newer (glibc 2.35+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev g++-mingw-w64-x86-64
      - name: Build
        run: |
          set -o pipefail
          sh source/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -v -E 'pragma|^ *\||^ *[0-9]+ \|' "$RUNNER_TEMP/build.log" | tail -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Checksums
        run: sha256sum Ttranslator.exe ttranslator-linux ttranslator-window.exe ttranslator-window-linux | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ttranslator-programs
          path: |
            Ttranslator.exe
            ttranslator-linux
            ttranslator-window.exe
            ttranslator-window-linux
            SHA256SUMS.txt
          retention-days: 14
      - name: Archives for Windows and Linux (test builds)
        run: |
          set -o pipefail
          sh source/release.sh "$RUNNER_TEMP/dist" 2>&1 | tee "$RUNNER_TEMP/release.log" || {
            tail -20 "$RUNNER_TEMP/release.log" | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cd "$RUNNER_TEMP/dist" && echo "WINZIP=$(ls Ttranslator-*-windows-x64.zip)" >> "$GITHUB_ENV" \
            && echo "LINTGZ=$(ls Ttranslator-*-linux-x64.tar.gz)" >> "$GITHUB_ENV"
      # one artifact per archive, not zipped again: the download is the archive itself
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/dist/${{ env.WINZIP }}
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/dist/${{ env.LINTGZ }}
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: archives-SHA256SUMS
          path: ${{ runner.temp }}/dist/SHA256SUMS.txt
          retention-days: 14

  macos:
    # macOS (1.1): Intel and Apple Silicon. source/ci/macos.sh <arch> <out-dir> builds, checks and puts the results
    # (archives, screenshots, logs) into <out-dir>; to have its archive uploaded as itself (not zipped again) it writes
    # MACZIP=<file name in out-dir> to $GITHUB_ENV.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and check (source/ci/macos.sh)
        run: |
          if [ -f source/ci/macos.sh ]; then
            bash source/ci/macos.sh "${{ matrix.arch }}" "$RUNNER_TEMP/macos-${{ matrix.arch }}"
          else
            echo "no source/ci/macos.sh yet: nothing to build for macOS"
          fi
      - name: Results of the run (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-results
          path: ${{ runner.temp }}/macos-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 14
      - name: The archive itself (not zipped again)
        if: env.MACZIP != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/macos-${{ matrix.arch }}/${{ env.MACZIP }}
          archive: false
          retention-days: 14

  android:
    # Android, a feasibility prototype: android/ci.sh <out-dir> builds, checks (the emulator: Linux runners have
    # hardware acceleration for it) and puts the results (a test APK, logs, screenshots) into <out-dir>.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - name: Build and check (android/ci.sh)
        run: |
          if [ -f android/ci.sh ]; then
            bash android/ci.sh "$RUNNER_TEMP/android"
          else
            echo "no android/ci.sh yet: nothing to build for Android"
          fi
      - name: Results of the run (test APK, logs, screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-results
          path: ${{ runner.temp }}/android
          if-no-files-found: ignore
          retention-days: 14
